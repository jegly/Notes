[versions]
agp = "9.4.1"
argon2kt = "1.6.0"                 # latest release
# No stable line has ever shipped for biometric-ktx; 1.4.0-alpha02 is the newest available.
biometricKtx = "1.4.0-alpha02"
datastorePreferences = "1.2.1"     # latest stable (1.3.0 is alpha only)
lifecycleRuntimeCompose = "2.11.0"
hilt = "2.60.1"
hiltCompiler = "1.4.0"
hiltAndroidCompiler = "2.60.1"
coilCompose = "3.5.0"
hiltNavigationCompose = "1.4.0"
kotlin = "2.4.21"
# KSP's version no longer tracks the Kotlin version — 2.3.0 was numbered to sort above
# 2.2.20-2.0.4 for Gradle's benefit. 2.3.11 supports Kotlin 2.2+ and carries explicit
# Kotlin 2.4.0 fixes.
ksp = "2.3.12"
m3color = "2026.1"
room = "2.8.5"                     # latest release
activityCompose = "1.13.0"         # latest release
coreKtx = "1.19.1"
coreSplashscreen = "1.2.0"
# material-icons-extended is frozen upstream; 1.7.8 is its final release.
compose = "1.7.8"
material3 = "1.4.0"                # latest stable (1.5.0 is alpha only)
navigationCompose = "2.10.2"        # latest stable (2.10.0 is rc only)
appcompat = "1.8.0"

[libraries]
# Room
androidx-biometric-ktx = { module = "androidx.biometric:biometric-ktx", version.ref = "biometricKtx" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }

# AndroidX
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }

# Compose
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "compose" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

#Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hiltAndroidCompiler" }
hilt-compile = { module = "androidx.hilt:hilt-compiler", version.ref = "hiltCompiler"}
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hiltAndroidCompiler" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
# Provides androidx.hilt.lifecycle.viewmodel.compose.hiltViewModel — the package
# hiltViewModel moved to in androidx.hilt 1.4.0. Pulled in transitively by
# hilt-navigation-compose, but declared explicitly since we import from it directly.
hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "hiltNavigationCompose" }

# Coil 3 — note the `coil-kt.coil3` group (coil 3 is repackaged)
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coilCompose" }

# M3Color | https://github.com/Kyant0/m3color
m3color = { module = "com.github.Kyant0:m3color", version.ref = "m3color" }

# Argon2id — memory-hard password hashing
argon2kt = { module = "com.lambdapioneer.argon2kt:argon2kt", version.ref = "argon2kt" }

[plugins]
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
